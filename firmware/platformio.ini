; PlatformIO Project Configuration for MeshLink
; Two ESP32 devices: Leader and Participant

[platformio]
default_envs = leader

; Common settings for all ESP32 devices
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; ============================================
; LEADER - Scans for participants (COM3 - FTDI)
; Uses src/main.cpp
; ============================================
[env:leader]
upload_port = COM4
monitor_port = COM4
build_src_filter = +<../src/>
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; ============================================
; PARTICIPANT - Advertises presence (COM4 - CP2102)
; Uses participant/main.cpp
; ============================================
[env:participant]
upload_port = COM5
monitor_port = COM5
build_src_filter = +<../participant/>
